name: BuildRoadRunner
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true' #for seanmiddleditch/gha-setup-ninja and ilammy/msvc-dev-cmd.

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - '**'

jobs:
  build_on_OSs:
    name: ${{ matrix.platform.name }} roadrunner build
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: macos-15-intel-release
            os_type: macos
            os_name: macos-15-intel
            build_type: Release
            build_python: ON
          - name: macos-15-intel-debug
            os_type: macos
            os_name: macos-15-intel
            build_type: Debug
            build_python: OFF
          - name: macos-14-release
            os_type: macos
            os_name: macos-14
            build_type: Release
            build_python: ON
          - name: macos-14-debug
            os_type: macos
            os_name: macos-14
            build_type: Debug
            build_python: OFF
          - name: ubuntu-latest-release
            os_type: ubuntu
            os_name: ubuntu-latest
            build_type: Release
            build_python: ON
          - name: ubuntu-latest-debug
            os_type: ubuntu
            os_name: ubuntu-latest
            build_type: Debug
            build_python: OFF
          - name: windows-latest-release
            os_type: windows
            os_name: windows-latest
            build_type: Release
            build_python: ON
          - name: windows-latest-debug
            os_type: windows
            os_name: windows-latest
            build_type: Debug
            build_python: OFF
          - name: manylinux_2_28-release
            os_type: manylinux
            os_name: ubuntu-latest
            container_image: quay.io/pypa/manylinux_2_28_x86_64
            build_type: Release
            build_python: ON
        libroadrunner_deps_owner: [ "sys-bio" ]
        libroadrunner_deps_repo: [ "libroadrunner-deps" ]
        libroadrunner_deps_name: [ "libroadrunner-deps" ]
        libroadrunner_deps_release_version: [ "v2.3.8" ]
        llvm_owner: [ "sys-bio" ]
        llvm_repo: [ "llvm-build" ]
        llvm_name: [ "llvm-23.1.4" ]
        llvm_release_version: [ "llvm-23.1.4-r2" ]
        build_tests: [ON]
        build_plugins: [ON]
    runs-on: ${{ matrix.platform.os_name }}
    container:
      image: ${{ matrix.platform.container_image || '' }}

    steps:
      - name: Setup python versions
        shell: bash
      # The extension uses the Python stable ABI, so it is built and packaged once, with v1.
      # v1 should be the earliest supported version (the Py_LIMITED_API floor), and v2 the latest
      # stable release, whatever that is when the workflow runs.
      # The wheel is tested on both.
        run: |
          echo "python_v1=3.10" >> $GITHUB_ENV
          echo "python_v2=3.x" >> $GITHUB_ENV
          echo "python_v1_name=v1" >> $GITHUB_ENV
          echo "python_v2_name=v2" >> $GITHUB_ENV

      - name: Checkout RoadRunner
        uses: actions/checkout@main

      - name: Setup Python for non-Manylinux platforms
        if: matrix.platform.build_python == 'ON' && matrix.platform.os_type != 'manylinux'
        uses: actions/setup-python@main
        with:
          python-version: ${{ env.python_v1 }}

      - name: Setup the latest Python for non-Manylinux platforms
        if: matrix.platform.build_python == 'ON' && matrix.platform.os_type != 'manylinux'
        uses: actions/setup-python@main
        id: latest_python
        with:
          python-version: ${{ env.python_v2 }}

      - name: Record the exact latest Python version
        if: matrix.platform.build_python == 'ON' && matrix.platform.os_type != 'manylinux'
        shell: bash
        run: echo "python_v2=${{ steps.latest_python.outputs.python-version }}" >> $GITHUB_ENV

      - name: Setup Python for Manylinux platforms
        if: matrix.platform.build_python == 'ON' && matrix.platform.os_type == 'manylinux'
        shell: bash
        run: |
          dnf install -y wget
          # Miniforge uses conda-forge as its only channel (no Anaconda 'defaults')
          wget https://github.com/conda-forge/miniforge/releases/latest/download/Miniforge3-Linux-x86_64.sh
          bash Miniforge3-Linux-x86_64.sh -b -p /Miniforge3

          /Miniforge3/bin/conda create -y --name ${{ env.python_v1_name }} python=${{ env.python_v1 }}
          /Miniforge3/bin/conda create -y --name ${{ env.python_v2_name }} python
           
          /Miniforge3/bin/conda init && bash ~/.bashrc && . ~/.bashrc
          cd ${RUNNER_WORKSPACE}
          # sed -i 's/PKG_CONFIG openssl /PKG_CONFIG openssl11 /g' configure

          echo "python_v1_exe=/Miniforge3/envs/${{ env.python_v1_name }}/bin/python" >> $GITHUB_ENV
          echo "python_v1_dir=/Miniforge3/envs/${{ env.python_v1_name }}"  >> $GITHUB_ENV
          echo "python_v2_exe=/Miniforge3/envs/${{ env.python_v2_name }}/bin/python" >> $GITHUB_ENV
          echo "python_v2_dir=/Miniforge3/envs/${{ env.python_v2_name }}"  >> $GITHUB_ENV

      - name: Setup Windows Python paths
        if: matrix.platform.build_python == 'ON' && matrix.platform.os_type == 'windows'
        run: |
          cd ${{ env.pythonLocation }}
          $pattern = '[\\]'

          cd ../../${{ env.python_v1 }}*/x64/
          $pythonWinExecutable = $(realpath .)
          $pythonWinExecutable = $pythonWinExecutable -replace $pattern, '/'
          echo "python_v1_exe=$pythonWinExecutable/python.exe" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "python_v1_dir=$pythonWinExecutable" | Out-File -FilePath $env:GITHUB_ENV -Append

          cd ../../${{ env.python_v2 }}*/x64/
          $pythonWinExecutable = $(realpath .)
          $pythonWinExecutable = $pythonWinExecutable -replace $pattern, '/'
          echo "python_v2_exe=$pythonWinExecutable/python.exe" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "python_v2_dir=$pythonWinExecutable" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Setup non-windows Python paths
        if: matrix.platform.build_python == 'ON' && matrix.platform.os_type != 'windows' && matrix.platform.os_type != 'manylinux'
        shell: bash
        run: |
          cd ${{ env.pythonLocation }}
          export py_lastdir="$(basename $PWD)"

          cd ../../${{ env.python_v1 }}*/$py_lastdir/
          ls
          echo "python_v1_exe=$PWD/python" >> $GITHUB_ENV
          echo "python_v1_dir=$PWD" >> $GITHUB_ENV

          cd ../../${{ env.python_v2 }}*/$py_lastdir/
          echo "python_v2_exe=$PWD/python" >> $GITHUB_ENV
          echo "python_v2_dir=$PWD" >> $GITHUB_ENV

          
      - name: Install Python dependencies
        if: matrix.platform.build_python == 'ON'
        shell: bash
        run: |
          cd ${RUNNER_WORKSPACE}/roadrunner
          ${{ env.python_v1_exe }} -m pip install --upgrade pip 
          ${{ env.python_v1_exe }} -m pip install -r ./requirements.txt
          ${{ env.python_v1_exe }} -m pip install -r ./test-requirements.txt
          ${{ env.python_v1_exe }} -m pip install build
          ${{ env.python_v2_exe }} -m pip install --upgrade pip 
          ${{ env.python_v2_exe }} -m pip install -r ./requirements.txt
          ${{ env.python_v2_exe }} -m pip install -r ./test-requirements.txt
          ${{ env.python_v2_exe }} -m pip install build
          # At one point, we needed this on manylinux:
          # ${{ env.python_v1_exe }} -m pip install --trusted-host pypi.org --trusted-host pypi.python.org --trusted-host files.pythonhosted.org -r requirements.txt

      - name: Set MSVC as the default compiler on Windows
        if: matrix.platform.os_type == 'windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Upgrade gcc on Linux
        if: matrix.platform.os_type == 'manylinux'
        shell: bash
        run: |
          if [ "${{ matrix.platform.os_type }}" == 'ubuntu' ]; then
            apt-get update
            apt-get install -y software-properties-common
            add-apt-repository -y ppa:ubuntu-toolchain-r/test
            apt-get update
            apt-get install -y gcc-11 g++-11
            update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-11 90
            update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-11 90
          elif [ "${{ matrix.platform.os_type }}" == 'manylinux' ]; then
            dnf install -y gcc-toolset-11
            scl enable gcc-toolset-11 bash
            echo "/opt/rh/gcc-toolset-11/root/usr/bin" >> "${GITHUB_PATH}"
          fi

      - name: Setup Ninja
        if: matrix.platform.os_type == 'manylinux'
        uses: seanmiddleditch/gha-setup-ninja@master

      - name: Get Host Architecture
        shell: bash
        run: |
          architecture=$(uname -m)
          echo "host_architecture=$architecture" >> $GITHUB_ENV
          if [ "${{ matrix.platform.os_type }}" == 'macos' ]; then
            echo "OSX_ARCHITECTURES=$architecture" >> $GITHUB_ENV
          fi

      - name: Install ccache
        shell: bash
        run: |
          cd ${RUNNER_WORKSPACE}
          if [ "${{ matrix.platform.os_type }}" == 'macos' ]; then
            brew install ccache
          elif [ "${{ matrix.platform.os_type }}" == 'ubuntu' ]; then
            sudo apt-get update
            sudo apt-get install -y ccache
          elif [ "${{ matrix.platform.os_type }}" == 'manylinux' ]; then
            mkdir -p ccache
            cd ccache
            curl -L https://github.com/ccache/ccache/releases/download/v4.9.1/ccache-4.9.1.tar.gz > ccache.tar.gz
            tar -zxf ccache.tar.gz
            rm ccache.tar.gz
            mkdir -p build-ccache
            mkdir -p install-ccache
            cd build-ccache
            cmake -DCMAKE_INSTALL_PREFIX="$RUNNER_WORKSPACE/ccache/install-ccache" -DCMAKE_BUILD_TYPE=Release ../ccache-4.9.1
            cmake --build . --target install
            echo "$RUNNER_WORKSPACE/ccache/install-ccache/bin" >> "${GITHUB_PATH}"
          fi

      - name: Prepare ccache timestamp on non-Windows platforms
        if: matrix.platform.os_type != 'windows'
        id: ccache_cache_timestamp
        shell: cmake -P {0}
        run: |
          string(TIMESTAMP current_date "%Y-%m-%d-%H;%M;%S" UTC)
          message("timestamp=${current_date}" >> $GITHUB_OUTPUT)
          # message("::set-output name=timestamp::${current_date}")

      - name: Set ccache cache directory on non-Windows
        if: matrix.platform.os_type != 'windows'
        shell: bash
        run: |
          cd ${RUNNER_WORKSPACE}
          echo "CCACHE_DIR=${RUNNER_WORKSPACE}/.ccache" >> $GITHUB_ENV
          echo "COMPILER_LAUNCHER=ccache" >> $GITHUB_ENV

      - name: Cache ccache files on non-Windows
        if: matrix.platform.os_type != 'windows'
        uses: actions/cache@main
        with:
          path: ${RUNNER_WORKSPACE}/.ccache
          key:
            ${{ runner.os }}-${{ steps.ccache_cache_timestamp.outputs.timestamp }}
          restore-keys: |
            ${{ runner.os }}-${{ steps.ccache_cache_timestamp.outputs.timestamp }}
            ${{ runner.os }}-

      - name: Install Swig
        if: matrix.platform.build_python == 'ON'
        shell: bash
        run: |
          # The PyPI wheels carry a prebuilt SWIG. The Python stable ABI needs 4.4.1 or newer.
          ${{ env.python_v1_exe }} -m pip install "swig>=4.4.1"
          scripts_dir=$(${{ env.python_v1_exe }} -c "import sysconfig; print(sysconfig.get_path('scripts').replace(chr(92), '/'))")
          if [ -f "${scripts_dir}/swig.exe" ]; then
            swig_exe="${scripts_dir}/swig.exe"
          elif [ -f "${scripts_dir}/swig" ]; then
            swig_exe="${scripts_dir}/swig"
          else
            swig_exe=$(command -v swig)
          fi
          test -n "${swig_exe}"
          "${swig_exe}" -version
          echo SWIG_DIR="-DSWIG_EXECUTABLE=${swig_exe}" >> $GITHUB_ENV
          echo PYTHON_DIR="-DPython_ROOT_DIR=${{ env.python_v1_dir }}" >> $GITHUB_ENV

      - name: Save standardized os/compiler names
        shell: bash
        run: |
          if [ "${{ matrix.platform.os_type }}" == 'windows' ]; then
            compiler_version=$(ls "C:\Program Files\Microsoft Visual Studio")
            echo "os_and_compiler=${{ matrix.platform.os_type }}-msvc$compiler_version" >> $GITHUB_ENV
          elif [ "${{ matrix.platform.os_type }}" == 'macos' ]; then
            os_version=$(sw_vers -productVersion | cut -d '.' -f 1)
            echo "os_and_compiler=${{ matrix.platform.os_type }}-${os_version}" >> $GITHUB_ENV
          elif [ "${{ matrix.platform.os_type }}" == 'ubuntu' ]; then
            os_version=$(lsb_release -rs | cut -d '.' -f 1)
            echo "os_and_compiler=${{ matrix.platform.os_type }}-${os_version}" >> $GITHUB_ENV
          elif [ "${{ matrix.platform.os_type }}" == 'manylinux' ]; then
            os_name="${{ matrix.platform.name }}"
            os_name_without_build_type="${os_name%%-*}"
            echo "os_and_compiler=${os_name_without_build_type}" >> $GITHUB_ENV
          fi

      - name: Download LibRoadRunner Dependencies binaries
        shell: bash
        run: |
          cd ${RUNNER_WORKSPACE}
          mkdir -p ${{ matrix.libroadrunner_deps_name }}-binaries
          cd ${{ matrix.libroadrunner_deps_name }}-binaries
          curl -LO "https://github.com/${{ matrix.libroadrunner_deps_owner }}/${{ matrix.libroadrunner_deps_repo }}/releases/download/${{ matrix.libroadrunner_deps_release_version }}/${{ matrix.libroadrunner_deps_name }}-${{ env.os_and_compiler }}-${{ env.host_architecture }}-${{ matrix.platform.build_type }}.zip"
          unzip -q ${{ matrix.libroadrunner_deps_name }}*.zip
          rm ${{ matrix.libroadrunner_deps_name }}*.zip
          echo RR_DEPENDENCIES_INSTALL_PREFIX="${RUNNER_WORKSPACE}/${{ matrix.libroadrunner_deps_name }}-binaries" >> $GITHUB_ENV

      - name: Download LLVM binaries
        if: matrix.platform.os_type != 'ubuntu'
        shell: bash
        run: |
          cd ${RUNNER_WORKSPACE}
          mkdir -p ${{ matrix.llvm_name }}-binaries
          cd ${{ matrix.llvm_name }}-binaries
          curl -LO "https://github.com/${{ matrix.llvm_owner }}/${{ matrix.llvm_repo }}/releases/download/${{ matrix.llvm_release_version }}/${{ matrix.llvm_name }}-${{ env.os_and_compiler }}-${{ env.host_architecture }}-${{ matrix.platform.build_type }}.zip"
          unzip -q ${{ matrix.llvm_name }}*.zip
          rm ${{ matrix.llvm_name }}*.zip
          echo LLVM_INSTALL_PREFIX="${RUNNER_WORKSPACE}/${{ matrix.llvm_name }}-binaries" >> $GITHUB_ENV

          # make llvm-config executable
          chmod a+x ${RUNNER_WORKSPACE}/${{ matrix.llvm_name }}-binaries/bin/llvm-config

      - name: Download LLVM binaries (ubuntu)
        if: matrix.platform.os_type == 'ubuntu'
        shell: bash
        run: |
          cd ${RUNNER_WORKSPACE}
          mkdir -p ${{ matrix.llvm_name }}-binaries
          cd ${{ matrix.llvm_name }}-binaries
          curl -LO "https://github.com/${{ matrix.llvm_owner }}/${{ matrix.llvm_repo }}/releases/download/${{ matrix.llvm_release_version }}/${{ matrix.llvm_name }}-${{ env.os_and_compiler }}-${{ env.host_architecture }}-Release.zip"
          unzip -q ${{ matrix.llvm_name }}*.zip
          rm ${{ matrix.llvm_name }}*.zip
          echo LLVM_INSTALL_PREFIX="${RUNNER_WORKSPACE}/${{ matrix.llvm_name }}-binaries" >> $GITHUB_ENV

          # make llvm-config executable
          chmod a+x ${RUNNER_WORKSPACE}/${{ matrix.llvm_name }}-binaries/bin/llvm-config

      - name: Setup Julia
        if: matrix.platform.os_type != 'manylinux'
        uses: julia-actions/setup-julia@master
        with:
          version: '1'

      - name: Create build directory
        shell: bash
        run: mkdir -p ${RUNNER_WORKSPACE}/build-roadrunner

      - name: Configure CMake for RoadRunner
        shell: bash
        run: |
          cd ${RUNNER_WORKSPACE}/build-roadrunner
          cmake $GITHUB_WORKSPACE \
          -G "Ninja" \
          -DCMAKE_C_COMPILER_LAUNCHER=${COMPILER_LAUNCHER} \
          -DCMAKE_CXX_COMPILER_LAUNCHER=${COMPILER_LAUNCHER} \
          -DCMAKE_BUILD_TYPE=${{ matrix.platform.build_type }} \
          -DCMAKE_OSX_ARCHITECTURES=${OSX_ARCHITECTURES} \
          -DCMAKE_INSTALL_PREFIX="${RUNNER_WORKSPACE}/install-roadrunner" \
          -DRR_DEPENDENCIES_INSTALL_PREFIX=${RR_DEPENDENCIES_INSTALL_PREFIX} \
          -DLLVM_INSTALL_PREFIX=${LLVM_INSTALL_PREFIX} \
          -DBUILD_TESTS=${{ matrix.build_tests }} \
          -DBUILD_RR_PLUGINS=${{ matrix.build_plugins }} \
          -DBUILD_PYTHON=${{ matrix.platform.build_python }} \
          -DBUILD_EXAMPLES=ON \
          -DBUILD_JULIA=ON \
          ${{ env.PYTHON_DIR }} \
          ${{ matrix.platform.build_python == 'ON' && env.SWIG_DIR || '' }}

      - name: Build and install RoadRunner
        shell: bash
        run: |
          cd ${RUNNER_WORKSPACE}/build-roadrunner
          cmake --build . --target install --config ${{ matrix.platform.build_type }}

      - name: Copy Windows Visual Studio runtime DLLs to python install directories
        if: matrix.platform.build_type == 'Release' && matrix.platform.os_type == 'windows'
        shell: bash
        run: |
          cd ${RUNNER_WORKSPACE}/install-roadrunner/bin/
          echo "Copying these files to roadrunner and rrplugins:"
          ls conc* msvc* vcruntime*
          cp conc* msvc* vcruntime* ${RUNNER_WORKSPACE}/install-roadrunner/site-packages/roadrunner/
          cp conc* msvc* vcruntime* ${RUNNER_WORKSPACE}/install-roadrunner/site-packages/rrplugins/libs/
          echo "Copying these files to the Julia package and its Antimony package:"
          cp conc* msvc* vcruntime* ${RUNNER_WORKSPACE}/install-roadrunner/bindings/julia/RoadRunner/lib/
          cp conc* msvc* vcruntime* ${RUNNER_WORKSPACE}/install-roadrunner/bindings/julia/RoadRunner/Antimony/lib/

      - name: Run C RoadRunner tests
        if: matrix.platform.build_type == 'Release' && matrix.build_tests == 'ON'
        shell: bash
        run: |
          cd ${RUNNER_WORKSPACE}/build-roadrunner
          ctest --output-on-failure --verbose --extra-verbose --progress --exclude-regex ython ${{ matrix.platform.os_type == 'macos' && '--label-exclude julia' || '' }}

      # On macOS the Julia process has its own LLVM, so the C API library used by the Julia
      # package must not export its statically linked LLVM. Only that library is relinked.
      - name: Relink the C API library for Julia and run the Julia tests (macOS)
        if: matrix.platform.build_type == 'Release' && matrix.platform.os_type == 'macos'
        shell: bash
        run: |
          cd ${RUNNER_WORKSPACE}/build-roadrunner
          cmake $GITHUB_WORKSPACE -DRR_C_API_HIDE_LLVM_SYMBOLS=ON
          cmake --build . --target roadrunner_c_api roadrunner_julia_package --config ${{ matrix.platform.build_type }}
          cp lib/libroadrunner_c_api.dylib ${RUNNER_WORKSPACE}/install-roadrunner/bindings/julia/RoadRunner/lib/
          if [ "${{ matrix.build_tests }}" == 'ON' ]; then
            julia --project=${RUNNER_WORKSPACE}/install-roadrunner/bindings/julia/RoadRunner ${RUNNER_WORKSPACE}/install-roadrunner/bindings/julia/RoadRunner/test/runtests.jl
          fi
          cmake $GITHUB_WORKSPACE -DRR_C_API_HIDE_LLVM_SYMBOLS=OFF
          cmake --build . --target roadrunner_c_api --config ${{ matrix.platform.build_type }}

      - name: Run LLJit section range tests (Debug)
        if: matrix.platform.build_type == 'Debug' && matrix.build_tests == 'ON'
        shell: bash
        run: |
          cd ${RUNNER_WORKSPACE}/build-roadrunner
          ctest --output-on-failure --verbose --extra-verbose --progress --tests-regex LLJitSectionRange

      - name: Run Python Roadrunner tests (earliest Python version)
        if: matrix.platform.build_python == 'ON' && matrix.build_tests == 'ON'
        shell: bash
        run: |
          cd ${RUNNER_WORKSPACE}/build-roadrunner
          ctest -C ${{ matrix.platform.build_type }} --output-on-failure --verbose --extra-verbose --progress --tests-regex ython

      - name: Save roadrunner version
        shell: bash
        run: |
          cd ${RUNNER_WORKSPACE}/install-roadrunner
          ls -l
          export rrversion="$(cat VERSION.txt)"
          echo "roadrunner_version=$rrversion" >> ${GITHUB_ENV}

      - name: Set artifacts path and name
        shell: bash
        run: |
          cd ${RUNNER_WORKSPACE}
          echo "artifacts_name=roadrunner-${{ env.roadrunner_version}}-${{ env.os_and_compiler }}-${host_architecture}-${{ matrix.platform.build_type }}" >> $GITHUB_ENV
          echo "artifacts_path=${RUNNER_WORKSPACE}/install-roadrunner" >> $GITHUB_ENV
          echo "julia_artifacts_path=${RUNNER_WORKSPACE}/install-roadrunner/bindings/julia" >> $GITHUB_ENV
          julia_platform="${{ matrix.platform.name }}"
          julia_platform="${julia_platform%-release}"
          julia_platform="${julia_platform%-debug}"
          if [ "${{ matrix.platform.os_type }}" == 'ubuntu' ]; then
            julia_platform="ubuntu-$(lsb_release -rs)"
          fi
          echo "julia_platform=${julia_platform}" >> $GITHUB_ENV

      - name: Upload roadrunner binaries
        uses: actions/upload-artifact@main
        with:
          name: ${{ env.artifacts_name }}
          path: ${{ env.artifacts_path }}

      # The package folder is self-contained: sources, the Antimony package, and the libraries.
      - name: Upload Julia package artifacts
        if: matrix.platform.build_type == 'Release'
        uses: actions/upload-artifact@main
        with:
          name: roadrunner-julia-${{ env.roadrunner_version }}-${{ env.julia_platform }}-release
          path: ${{ env.julia_artifacts_path }}

      - name: Create Python wheel artifacts
        if: matrix.platform.build_type == 'Release' && matrix.platform.build_python == 'ON'
        shell: bash
        run: |
          cd ${RUNNER_WORKSPACE}/install-roadrunner
          ${{ env.python_v1_exe }} -m build --wheel
          rm -r -f build
          mv setup_rrplugins.py setup.py
          ${{ env.python_v1_exe }} -m build --wheel
          rm -r -f build

      - name: Rename Python wheel artifacts
        if: matrix.platform.build_type == 'Release' && matrix.platform.build_python == 'ON'
        shell: bash
        run: |
          mkdir ${RUNNER_WORKSPACE}/wheels/
          cd ${RUNNER_WORKSPACE}/install-roadrunner/dist
          if compgen -G "*universal*whl" > /dev/null; then
            mv libroadrunner*universal*.whl $(echo libroadrunner*universal*.whl | sed "s/universal2/${host_architecture}/g")
            mv rrplugins*universal*.whl $(echo rrplugins*universal*.whl | sed "s/universal2/${host_architecture}/g")
          elif compgen -G "*-linux*whl" > /dev/null; then
            mv libroadrunner*-linux*.whl $(echo libroadrunner*-linux*.whl | sed "s/-linux/-manylinux_2_28/g")
            mv rrplugins*-linux*.whl $(echo rrplugins*-linux*.whl | sed "s/-linux/-manylinux_2_28/g")
          fi
          mv * ${RUNNER_WORKSPACE}/wheels/

      # The wheel built above is installed into the latest Python and tested there.
      - name: Test the Python wheel on the latest Python version
        if: matrix.platform.build_type == 'Release' && matrix.platform.build_python == 'ON' && matrix.build_tests == 'ON'
        shell: bash
        run: |
          shopt -s nullglob
          # cd first: RUNNER_WORKSPACE has backslashes on Windows, which a glob would treat as escapes.
          cd "${RUNNER_WORKSPACE}/wheels"
          wheels=(libroadrunner-*.whl)
          if [ ${#wheels[@]} -ne 1 ]; then
            echo "::error::Expected exactly one libroadrunner wheel, found ${#wheels[@]}"
            ls -l
            exit 1
          fi
          ${{ env.python_v2_exe }} -m pip install --force-reinstall "./${wheels[0]}"
          # Leave the checkout so that 'import roadrunner' cannot find the source tree.
          cd "$(mktemp -d)"
          ${{ env.python_v2_exe }} -c "import sys, roadrunner; print(sys.version); print(roadrunner.__file__)"
          tests_dir=$(${{ env.python_v2_exe }} -c "import os, roadrunner.tests as t; print(os.path.dirname(t.__file__).replace(os.sep, '/'))")
          # The tests open their model files by relative path, so they run from their own directory.
          cd "$tests_dir"
          ${{ env.python_v2_exe }} "$tests_dir"
          ${{ env.python_v2_exe }} -m pytest test_namedArray.py test_python_api.py

      - name: Set Python wheel artifacts path and name
        if: matrix.platform.build_type == 'Release' && matrix.platform.build_python == 'ON'
        shell: bash
        run: |
          cd ${RUNNER_WORKSPACE}
          echo "roadrunner_python_wheel_artifacts_name=roadrunner-$roadrunner_version-python-wheels-${{ env.os_and_compiler }}-${host_architecture}" >> $GITHUB_ENV
          echo "roadrunner_python_wheel_artifacts_file=${RUNNER_WORKSPACE}/wheels/" >> ${GITHUB_ENV}

      - name: Upload RoadRunner Python wheel artifacts
        if: matrix.platform.build_type == 'Release' && matrix.platform.build_python == 'ON'
        uses: actions/upload-artifact@main
        with:
          name: ${{ env.roadrunner_python_wheel_artifacts_name }}
          path: ${{ env.roadrunner_python_wheel_artifacts_file }}

  import_manylinux_wheel:
    name: import manylinux wheel, Python ${{ matrix.python }}
    # Installs the manylinux wheel built above into a clean Debian container with a
    # uv-managed Python (libpython kept in the interpreter's own lib/, not on the
    # loader path), then checks that 'import roadrunner' works and a model simulates.
    # It guards against the Python module linking libpython (#1280).
    needs: build_on_OSs
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: debian:12-slim
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "latest"]
    env:
      MATRIX_PYTHON: ${{ matrix.python }}

    steps:
      - name: Install certificates
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates

      - name: Download manylinux wheels
        uses: actions/download-artifact@main
        with:
          pattern: roadrunner-*-python-wheels-manylinux_2_28-*
          merge-multiple: true
          path: wheels

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false

      - name: Create venv from a uv-managed Python
        run: |
          if [ "$MATRIX_PYTHON" = latest ]; then
            uv python install
            uv venv --managed-python venv
          else
            uv venv --python "$MATRIX_PYTHON" --managed-python venv
          fi

      - name: Check libpython is not on the loader path
        run: |
          echo "LD_LIBRARY_PATH='${LD_LIBRARY_PATH:-}'"
          if ldconfig -p | grep -i libpython; then
            echo "::error::libpython is on the default loader path, which would hide the problem"
            exit 1
          fi
          venv/bin/python -c "import sysconfig; print('LIBDIR', sysconfig.get_config_var('LIBDIR')); print('Py_ENABLE_SHARED', sysconfig.get_config_var('Py_ENABLE_SHARED'))"

      - name: Install the libroadrunner wheel
        run: |
          ls -l wheels
          shopt -s nullglob
          files=(wheels/libroadrunner-*-cp310-abi3-*.whl)
          if [ ${#files[@]} -ne 1 ]; then
            echo "::error::Expected exactly one cp310-abi3 libroadrunner wheel, found ${#files[@]}"
            exit 1
          fi
          uv pip install --python venv/bin/python "${files[0]}"

      - name: Check shared object dependencies
        run: |
          status=0
          count=0
          for so in $(find venv/lib/python*/site-packages/roadrunner -name '*.so*'); do
            count=$((count + 1))
            echo "== $so"
            ldd "$so" | tee ldd.txt
            if grep -Ei 'not found|libpython' ldd.txt; then status=1; fi
          done
          if [ $count -eq 0 ]; then
            echo "::error::No shared objects found in the installed roadrunner package"
            exit 1
          fi
          exit $status

      - name: Import roadrunner and simulate
        run: |
          unset LD_LIBRARY_PATH
          venv/bin/python - <<'PY'
          import math
          import roadrunner

          sbml = """<?xml version="1.0" encoding="UTF-8"?>
          <sbml xmlns="http://www.sbml.org/sbml/level3/version1/core" level="3" version="1">
            <model id="decay">
              <listOfParameters>
                <parameter id="x" value="1" constant="false"/>
                <parameter id="k" value="1" constant="true"/>
              </listOfParameters>
              <listOfRules>
                <rateRule variable="x">
                  <math xmlns="http://www.w3.org/1998/Math/MathML">
                    <apply><times/><apply><minus/><ci> k </ci></apply><ci> x </ci></apply>
                  </math>
                </rateRule>
              </listOfRules>
            </model>
          </sbml>"""

          print("imported from", roadrunner.__file__)
          rr = roadrunner.RoadRunner(sbml)
          rr.simulate(0, 1, 11)
          x = rr.getValue("x")
          print("x(1) =", x)
          assert abs(x - math.exp(-1)) < 1e-4, x
          PY

  # The extension no longer uses the numpy C API, so one wheel has to work with any numpy
  # that supports the Python in use: the oldest that has Python 3.10 wheels, the last
  # release that still supports 3.10, and the newest on the latest Python.
  # Each platform's wheel from the build job is tested with each combination.
  test_wheel_numpy_versions:
    name: ${{ matrix.platform.name }} wheel, Python ${{ matrix.combo.python }}, numpy ${{ matrix.combo.label }}
    needs: build_on_OSs
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: manylinux
            runner: ubuntu-latest
            wheels: roadrunner-*-python-wheels-manylinux_2_28-*
          - name: ubuntu
            runner: ubuntu-latest
            wheels: roadrunner-*-python-wheels-ubuntu-*
          - name: macos-intel
            runner: macos-15-intel
            wheels: roadrunner-*-python-wheels-macos-*-x86_64
          - name: macos-arm
            runner: macos-14
            wheels: roadrunner-*-python-wheels-macos-*-arm64
          - name: windows
            runner: windows-latest
            wheels: roadrunner-*-python-wheels-windows-*
        combo:
          - python: "3.10"
            numpy: "==1.21.3"
            label: "1.21.3 (oldest)"
          - python: "3.10"
            numpy: "==2.2.*"
            label: "2.2 (last with Python 3.10)"
          - python: "latest"
            numpy: ""
            label: "latest"
    env:
      MATRIX_PYTHON: ${{ matrix.combo.python }}
      NUMPY_SPEC: ${{ matrix.combo.numpy }}

    steps:
      - name: Download the wheels for this platform
        uses: actions/download-artifact@main
        with:
          pattern: ${{ matrix.platform.wheels }}
          merge-multiple: true
          path: wheels

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false

      - name: Install the wheel with the chosen numpy
        run: |
          shopt -s nullglob
          files=(wheels/libroadrunner-*-cp310-abi3-*.whl)
          if [ ${#files[@]} -ne 1 ]; then
            echo "::error::Expected exactly one cp310-abi3 libroadrunner wheel, found ${#files[@]}"
            ls -l wheels
            exit 1
          fi
          if [ "$MATRIX_PYTHON" = latest ]; then
            uv python install
            uv venv --managed-python venv
          else
            uv venv --python "$MATRIX_PYTHON" --managed-python venv
          fi
          # No realpath here: venv/bin/python is a symlink to the uv-managed interpreter, which uv won't modify.
          if [ -x venv/Scripts/python.exe ]; then
            venv_python="$PWD/venv/Scripts/python.exe"
          else
            venv_python="$PWD/venv/bin/python"
          fi
          echo "VENV_PYTHON=$venv_python" >> "$GITHUB_ENV"
          # Installed together, so the wheel's own numpy requirement is checked against the chosen numpy.
          # --no-build makes a numpy with no wheel for this platform fail at once.
          plugin_files=(wheels/rrplugins-*-cp310-abi3-*.whl)
          if [ ${#plugin_files[@]} -ne 1 ]; then
            echo "::error::Expected exactly one cp310-abi3 rrplugins wheel, found ${#plugin_files[@]}"
            ls -l wheels
            exit 1
          fi
          uv pip install --python "$venv_python" --no-build "${files[0]}" "${plugin_files[0]}" "numpy${NUMPY_SPEC}" pandas py-cpuinfo pytest
          "$venv_python" -c "import sys, numpy; print(sys.version); print('numpy', numpy.__version__)"

      - name: Run the NamedArray, rrplugins and API tests
        run: |
          # Leave the checkout so that 'import roadrunner' finds the installed wheel.
          cd "$(mktemp -d)"
          tests_dir=$("$VENV_PYTHON" -c "import os, roadrunner.tests as t; print(os.path.dirname(t.__file__).replace(os.sep, '/'))")
          # The tests open their model files by relative path, so they run from their own directory.
          cd "$tests_dir"
          "$VENV_PYTHON" -m pytest test_namedArray.py test_rrplugins_dataseries.py test_python_api.py

  # Tests the Julia packages from the uploaded artifacts, rather than the build tree, on
  # runners other than the ones that built them. The manylinux package is tested on ubuntu
  # to check the packaged libraries load on a different Linux distribution. On macOS the
  # files are marked as downloaded from the web, as a browser would, to check that the
  # unsigned libraries still load.
  test_julia_package:
    name: Test Julia package ${{ matrix.package }} on ${{ matrix.runner }}, Julia ${{ matrix.julia }}
    needs: build_on_OSs
    if: ${{ !cancelled() }}
    permissions:
      contents: read
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - {package: manylinux_2_28, runner: ubuntu-latest, julia: "1.6"}
          - {package: manylinux_2_28, runner: ubuntu-latest, julia: "1.10"}
          - {package: manylinux_2_28, runner: ubuntu-latest, julia: "1"}
          - {package: windows-latest, runner: windows-latest, julia: "1"}
          - {package: macos-14, runner: macos-14, julia: "1"}
          - {package: macos-15-intel, runner: macos-15-intel, julia: "1"}
    steps:
      - name: Show the OS version
        if: runner.os == 'Linux'
        run: |
          . /etc/os-release
          echo "Testing on $PRETTY_NAME"

      - name: Download the Julia package
        uses: actions/download-artifact@main
        with:
          pattern: roadrunner-julia-*-${{ matrix.package }}-release
          merge-multiple: true
          path: roadrunner-julia

      - name: Setup Julia
        uses: julia-actions/setup-julia@master
        with:
          version: ${{ matrix.julia }}

      - name: Check the bundled Antimony version
        run: |
          ver=$(grep '^version' roadrunner-julia/RoadRunner/Antimony/Project.toml | cut -d '"' -f 2)
          echo "Bundled Antimony Julia package version: $ver"
          test "$(printf '%s\n' 3.3.0 "$ver" | sort -V | head -n 1)" = "3.3.0"

      - name: Check that the package DLLs find all their dependencies
        if: runner.os == 'Windows'
        run: |
          python -m pip install pefile
          python - <<'EOF'
          import os, re, sys
          import pefile
          root = 'roadrunner-julia/RoadRunner'
          system32 = os.path.join(os.environ['SystemRoot'], 'System32')
          # The Visual C++ runtime must be shipped in the package, not found on the machine.
          redist = re.compile(r'^(vcruntime|msvcp|concrt|vcomp)', re.I)
          problems = []
          for folder, _, files in os.walk(root):
              for name in files:
                  if not name.lower().endswith('.dll'):
                      continue
                  path = os.path.join(folder, name)
                  pe = pefile.PE(path, fast_load=True)
                  pe.parse_data_directories([pefile.DIRECTORY_ENTRY['IMAGE_DIRECTORY_ENTRY_IMPORT']])
                  imports = [e.dll.decode() for e in getattr(pe, 'DIRECTORY_ENTRY_IMPORT', [])]
                  print(path, '->', ', '.join(imports))
                  for dep in imports:
                      if dep.lower().startswith(('api-ms-win-', 'ext-ms-win-')):
                          continue
                      if os.path.exists(os.path.join(folder, dep)):
                          continue
                      if os.path.exists(os.path.join(system32, dep)) and not redist.match(dep):
                          continue
                      problems.append(path + ' needs ' + dep)
          if problems:
              print('\n'.join(problems))
              sys.exit(1)
          EOF

      - name: Mark the package as downloaded from the web
        if: runner.os == 'macOS'
        run: |
          find roadrunner-julia -type f -exec xattr -w com.apple.quarantine "0081;$(printf '%x' "$(date +%s)");Safari;" {} +
          xattr -l roadrunner-julia/RoadRunner/lib/*.dylib

      - name: Run the Julia package tests
        run: julia --project=roadrunner-julia/RoadRunner roadrunner-julia/RoadRunner/test/runtests.jl