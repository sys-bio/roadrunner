  import_manylinux_wheel:
    name: import manylinux wheel, Python ${{ matrix.python }}
    # Installs the manylinux wheel built above into a clean Debian container with a
    # uv-managed Python (libpython kept in the interpreter's own lib/, not on the
    # loader path), then checks that 'import roadrunner' works and a model simulates.
    # It guards against the Python module linking libpython (#1280).
    needs: build_on_OSs
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: debian:12-slim
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14", "3.15"]
    env:
      MATRIX_PYTHON: ${{ matrix.python }}

    steps:
      - name: Install certificates
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates

      - name: Download manylinux wheels
        id: download
        continue-on-error: true
        uses: actions/download-artifact@main
        with:
          pattern: roadrunner-*-python-wheels-manylinux_2_28-*
          merge-multiple: true
          path: wheels

      - name: Report missing wheel artifact
        if: steps.download.outcome != 'success'
        run: echo "::warning::No manylinux wheel artifact was found for this run, so nothing was tested."

      - name: Install uv
        if: steps.download.outcome == 'success'
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false

      - name: Create venv from a uv-managed Python
        if: steps.download.outcome == 'success'
        run: uv venv --python "$MATRIX_PYTHON" --managed-python venv

      - name: Check libpython is not on the loader path
        if: steps.download.outcome == 'success'
        run: |
          echo "LD_LIBRARY_PATH='${LD_LIBRARY_PATH:-}'"
          if ldconfig -p | grep -i libpython; then
            echo "::error::libpython is on the default loader path, which would hide the problem"
            exit 1
          fi
          venv/bin/python -c "import sysconfig; print('LIBDIR', sysconfig.get_config_var('LIBDIR')); print('Py_ENABLE_SHARED', sysconfig.get_config_var('Py_ENABLE_SHARED'))"

      - name: Install the libroadrunner wheel
        if: steps.download.outcome == 'success'
        run: |
          ls -l wheels
          tag="cp${MATRIX_PYTHON/./}"
          shopt -s nullglob
          files=(wheels/libroadrunner-*-${tag}-${tag}-*.whl)
          if [ ${#files[@]} -ne 1 ]; then
            echo "::error::Expected exactly one libroadrunner wheel for ${tag}, found ${#files[@]}"
            exit 1
          fi
          uv pip install --python venv/bin/python "${files[0]}"

      - name: Check shared object dependencies
        if: steps.download.outcome == 'success'
        run: |
          status=0
          count=0
          for so in $(find venv/lib/python*/site-packages/roadrunner -name '*.so*'); do
            count=$((count + 1))
            echo "== $so"
            ldd "$so" | tee ldd.txt
            if grep -Ei 'not found|libpython' ldd.txt; then status=1; fi
          done
          if [ $count -eq 0 ]; then
            echo "::error::No shared objects found in the installed roadrunner package"
            exit 1
          fi
          exit $status

      - name: Import roadrunner and simulate
        if: steps.download.outcome == 'success'
        run: |
          unset LD_LIBRARY_PATH
          venv/bin/python - <<'PY'
          import math
          import roadrunner

          sbml = """<?xml version="1.0" encoding="UTF-8"?>
          <sbml xmlns="http://www.sbml.org/sbml/level3/version1/core" level="3" version="1">
            <model id="decay">
              <listOfParameters>
                <parameter id="x" value="1" constant="false"/>
                <parameter id="k" value="1" constant="true"/>
              </listOfParameters>
              <listOfRules>
                <rateRule variable="x">
                  <math xmlns="http://www.w3.org/1998/Math/MathML">
                    <apply><times/><apply><minus/><ci> k </ci></apply><ci> x </ci></apply>
                  </math>
                </rateRule>
              </listOfRules>
            </model>
          </sbml>"""

          print("imported from", roadrunner.__file__)
          rr = roadrunner.RoadRunner(sbml)
          rr.simulate(0, 1, 11)
          x = rr.getValue("x")
          print("x(1) =", x)
          assert abs(x - math.exp(-1)) < 1e-4, x
          PY

  # Runs the tests shipped inside the manylinux Julia package on a different Linux
  # distribution, to check the packaged libraries load there.
  test_manylinux_julia_package:
    name: Test the manylinux Julia package on ubuntu, Julia ${{ matrix.julia }}
    needs: build_on_OSs
    if: ${{ !cancelled() }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        julia: ["1.6", "1.10", "1"]
    steps:
      - name: Show the OS version
        run: |
          . /etc/os-release
          echo "Testing on $PRETTY_NAME"

      - name: Download the Julia package
        id: download
        continue-on-error: true
        uses: actions/download-artifact@main
        with:
          pattern: roadrunner-julia-*-manylinux_2_28-release
          merge-multiple: true
          path: roadrunner-julia

      - name: Report missing Julia package artifact
        if: steps.download.outcome != 'success'
        run: echo "::warning::No Julia package artifact was found for this run, so nothing was tested."

      - name: Setup Julia
        if: steps.download.outcome == 'success'
        uses: julia-actions/setup-julia@master
        with:
          version: ${{ matrix.julia }}

      - name: Check the bundled Antimony version
        if: steps.download.outcome == 'success'
        shell: bash
        run: |
          ver=$(grep '^version' roadrunner-julia/RoadRunner/Antimony/Project.toml | cut -d '"' -f 2)
          echo "Bundled Antimony Julia package version: $ver"
          test "$(printf '%s\n' 3.3.0 "$ver" | sort -V | head -n 1)" = "3.3.0"

      - name: Run the Julia package tests
        if: steps.download.outcome == 'success'
        shell: bash
        run: julia --project=roadrunner-julia/RoadRunner roadrunner-julia/RoadRunner/test/runtests.jl

  # Tests the Julia package from the uploaded artifact, rather than the build tree,
  # on a different runner from the one that built it.
  test_windows_julia_package:
    name: Test the Windows Julia package from the artifact
    needs: build_on_OSs
    if: ${{ !cancelled() }}
    permissions:
      contents: read
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Download the Julia package
        id: download
        continue-on-error: true
        uses: actions/download-artifact@main
        with:
          pattern: roadrunner-julia-*-windows-latest-release
          merge-multiple: true
          path: roadrunner-julia

      - name: Report missing Julia package artifact
        if: steps.download.outcome != 'success'
        run: echo "::warning::No Julia package artifact was found for this run, so nothing was tested."

      - name: Setup Julia
        if: steps.download.outcome == 'success'
        uses: julia-actions/setup-julia@master
        with:
          version: '1'

      - name: Check the bundled Antimony version
        if: steps.download.outcome == 'success'
        shell: bash
        run: |
          ver=$(grep '^version' roadrunner-julia/RoadRunner/Antimony/Project.toml | cut -d '"' -f 2)
          echo "Bundled Antimony Julia package version: $ver"
          test "$(printf '%s\n' 3.3.0 "$ver" | sort -V | head -n 1)" = "3.3.0"

      - name: Check that the package DLLs find all their dependencies
        if: steps.download.outcome == 'success'
        run: |
          python -m pip install pefile
          python - <<'EOF'
          import os, re, sys
          import pefile
          root = 'roadrunner-julia/RoadRunner'
          system32 = os.path.join(os.environ['SystemRoot'], 'System32')
          # The Visual C++ runtime must be shipped in the package, not found on the machine.
          redist = re.compile(r'^(vcruntime|msvcp|concrt|vcomp)', re.I)
          problems = []
          for folder, _, files in os.walk(root):
              for name in files:
                  if not name.lower().endswith('.dll'):
                      continue
                  path = os.path.join(folder, name)
                  pe = pefile.PE(path, fast_load=True)
                  pe.parse_data_directories([pefile.DIRECTORY_ENTRY['IMAGE_DIRECTORY_ENTRY_IMPORT']])
                  imports = [e.dll.decode() for e in getattr(pe, 'DIRECTORY_ENTRY_IMPORT', [])]
                  print(path, '->', ', '.join(imports))
                  for dep in imports:
                      if dep.lower().startswith(('api-ms-win-', 'ext-ms-win-')):
                          continue
                      if os.path.exists(os.path.join(folder, dep)):
                          continue
                      if os.path.exists(os.path.join(system32, dep)) and not redist.match(dep):
                          continue
                      problems.append(path + ' needs ' + dep)
          if problems:
              print('\n'.join(problems))
              sys.exit(1)
          EOF

      - name: Run the Julia package tests
        if: steps.download.outcome == 'success'
        run: julia --project=roadrunner-julia/RoadRunner roadrunner-julia/RoadRunner/test/runtests.jl

  # Tests the Julia package from the uploaded artifact, rather than the build tree,
  # on a different runner from the one that built it.
  # The files are marked as downloaded from the web, as a browser would, to check that
  # the unsigned libraries still load.
  test_macos_julia_package:
    name: Test the ${{ matrix.platform }} Julia package from the artifact
    needs: build_on_OSs
    if: ${{ !cancelled() }}
    permissions:
      contents: read
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-14, macos-15-intel]
    steps:
      - name: Download the Julia package
        id: download
        continue-on-error: true
        uses: actions/download-artifact@main
        with:
          pattern: roadrunner-julia-*-${{ matrix.platform }}-release
          merge-multiple: true
          path: roadrunner-julia

      - name: Report missing Julia package artifact
        if: steps.download.outcome != 'success'
        run: echo "::warning::No Julia package artifact was found for this run, so nothing was tested."

      - name: Setup Julia
        if: steps.download.outcome == 'success'
        uses: julia-actions/setup-julia@master
        with:
          version: '1'

      - name: Check the bundled Antimony version
        if: steps.download.outcome == 'success'
        shell: bash
        run: |
          ver=$(grep '^version' roadrunner-julia/RoadRunner/Antimony/Project.toml | cut -d '"' -f 2)
          echo "Bundled Antimony Julia package version: $ver"
          test "$(printf '%s\n' 3.3.0 "$ver" | sort -V | head -n 1)" = "3.3.0"

      - name: Mark the package as downloaded from the web
        if: steps.download.outcome == 'success'
        shell: bash
        run: |
          find roadrunner-julia -type f -exec xattr -w com.apple.quarantine "0081;$(printf '%x' "$(date +%s)");Safari;" {} +
          xattr -l roadrunner-julia/RoadRunner/lib/*.dylib

      - name: Run the Julia package tests
        if: steps.download.outcome == 'success'
        shell: bash
        run: julia --project=roadrunner-julia/RoadRunner roadrunner-julia/RoadRunner/test/runtests.jl
